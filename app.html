<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>枝豆のFP3級ドリル</title>
<style>
:root{--g:#69ad75;--bg:#f6fbf5;--line:#dfe9df;--muted:#748078}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;background:var(--bg);color:#26332a}header{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line);padding:16px;font-weight:900;z-index:3}main{max-width:700px;margin:auto;padding:16px 16px 88px}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:14px;box-shadow:0 8px 24px #46644b12}h1{font-size:26px;margin:0 0 8px}.muted{color:var(--muted);line-height:1.7}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}.stat{background:#eaf6ec;border-radius:14px;padding:11px;text-align:center}.stat b{display:block;font-size:20px}.stat span{font-size:11px;color:var(--muted)}button{border:0;border-radius:14px;padding:14px;font-weight:800;font-size:15px;cursor:pointer}.wide{width:100%;margin-top:10px}.primary{background:var(--g);color:#fff}.secondary{background:#eaf6ec;color:#315c39}.hidden{display:none!important}.q{font-size:20px;font-weight:900;line-height:1.55;margin:16px 0}.opt{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);margin:8px 0}.ok{background:#edf8ef!important;border-color:#83c591!important}.ng{background:#fff0f0!important;border-color:#d98b8b!important}.feedback{background:#f4f8f4;border-radius:14px;padding:14px;line-height:1.7;margin-top:12px}.search{width:100%;padding:13px;border:1px solid #cfdacf;border-radius:14px;font-size:16px}.item{padding:13px 0;border-bottom:1px solid #e8eee8}.item:last-child{border-bottom:0}.item h3{margin:5px 0}.tag{font-size:11px;background:#eaf6ec;color:#4d7555;border-radius:20px;padding:4px 8px}.colbody{background:#f8fbf8;border-radius:14px;padding:14px;line-height:1.9;margin-top:10px}.nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom);z-index:5}.nav button{background:#fff;border-radius:0;padding:10px 2px;font-size:12px;color:#536059}.nav .active{color:#4d965a}.notice{background:#fff8e8;padding:13px;border-radius:14px;font-size:13px;line-height:1.7}
</style></head><body><header>🌱 枝豆のFP3級ドリル</header><main>
<section id="home"><div class="card"><small>FP3級 学習サポート</small><h1>今日もちょっとだけ</h1><p class="muted">問題を解いて、言葉を調べて、難しいところはやさしいコラムで復習できます。</p><div class="stats"><div class="stat"><b id="rate">0%</b><span>正答率</span></div><div class="stat"><b id="answered">0問</b><span>解いた問題</span></div><div class="stat"><b id="wrongCount">0問</b><span>復習待ち</span></div></div><button id="daily" class="wide primary">今日の10問をはじめる</button><button id="review" class="wide secondary">間違えた問題だけ復習</button></div><div class="notice">制度・税金・社会保険は改正されることがあります。試験前には最新教材や公式情報も確認してください。</div></section>
<section id="quiz" class="hidden"><div class="card"><small id="count"></small><div id="question" class="q"></div><div id="options"></div><div id="feedback" class="feedback hidden"></div><button id="next" class="wide primary hidden">次の問題へ</button></div></section>
<section id="words" class="hidden"><div class="card"><h1>ことば帳</h1><p class="muted">「これ何だっけ？」をすぐ検索できます。</p><input id="search" class="search" placeholder="例：PER、債券、相続"><div id="wordList"></div></div></section>
<section id="columns" class="hidden"><div class="card"><h1>やさしいコラム</h1><p class="muted">つまずきやすいところを、小学生でも分かる言葉で説明します。</p><div id="columnList"></div></div></section>
<section id="result" class="hidden"><div class="card" style="text-align:center"><h1>おつかれさま！</h1><div id="score" style="font-size:44px;font-weight:900;color:var(--g)"></div><p id="resultText" class="muted"></p><button id="backHome" class="wide primary">ホームへ戻る</button></div></section>
</main><nav class="nav"><button data-page="home" class="active">🏠<br>ホーム</button><button id="navQuiz">✏️<br>問題</button><button data-page="words">📖<br>ことば帳</button><button data-page="columns">📝<br>コラム</button></nav>
<script>
const Q=[
["将来ほしい金額から、毎年いくら積み立てるかを考える係数は？",["終価係数","減債基金係数","現価係数","資本回収係数"],1,"減債基金係数は『将来100万円ほしい。毎年いくら貯める？』を考える係数です。"],
["今あるお金から、毎年いくら受け取れるかを考える係数は？",["資本回収係数","減債基金係数","終価係数","現価係数"],0,"資本回収係数は『今ある100万円から、毎年いくら使える？』を考える係数です。"],
["市場の金利が上がると、すでに発行された固定金利の債券価格は一般にどうなる？",["上がりやすい","下がりやすい","変わらない","2倍になる"],1,"新しい債券の金利が高くなると、古い低金利の債券の人気が下がるため、価格も下がりやすくなります。"],
["会社がお金を返せなくなるかもしれない危険を何という？",["信用リスク","為替リスク","流動性預金","配当率"],0,"信用リスクは『貸した相手がお金を返せないかもしれない危険』です。"],
["PERは、株価を何で割って計算する？",["1株あたり利益","1株あたり純資産","年間配当金","売上高"],0,"PER＝株価÷1株あたり利益（EPS）。利益に対して株価が何倍かを見る数字です。"],
["PBRは、株価を何で割って計算する？",["年間配当金","売上高","1株あたり純資産","1株あたり利益"],2,"PBR＝株価÷1株あたり純資産（BPS）。会社の財産に対して株価が何倍かを見る数字です。"],
["株価2,000円、年間配当60円。配当利回りは？",["1％","2％","3％","6％"],2,"60÷2,000×100＝3％です。"],
["含み益は、株を売らずにそのまま別の株の購入代金として使える？",["使える","使えない","自動で配当になる","自動でポイントになる"],1,"含み益は『今売れば利益が出る状態』で、まだ現金ではありません。"],
["定期保険の特徴として近いものは？",["決めた期間だけ死亡保障がある","一生涯の死亡保障が続く","必ず元本以上戻る","自動車だけを保障する"],0,"定期保険は『10年間』など、決めた期間だけ死亡保障を持つ保険です。"],
["地震が原因で起きた火災に備える保険は？",["火災保険だけ","地震保険","自賠責保険","生命保険"],1,"地震が原因の火災は、基本的に地震保険で備えます。"],
["自賠責保険が主に補償するものは？",["自分の車","相手の車","他人のけがや死亡","自宅の火災"],2,"自賠責保険は交通事故の被害者を守るため、主に他人のけがや死亡を補償します。"],
["上場企業とは、簡単にいうとどんな会社？",["株を証券取引所で売買できる会社","国が経営する会社","必ず黒字の会社","社員100人以上の会社"],0,"上場企業は、その会社の株を証券取引所で一般の投資家が売買できる会社です。"]
];
const W=[
["PER","利益に対して株価が何倍かを見る数字。","株式"],["PBR","会社の財産に対して株価が何倍かを見る数字。","株式"],["EPS","1株あたりの会社の利益。","株式"],["BPS","1株あたりの会社の純資産。","株式"],["配当金","会社が利益などの一部を株主に分けるお金。","株式"],["株主優待","株主に商品や割引券などを渡すサービス。","株式"],["含み益","まだ売っていないが、今売れば利益が出る状態。","株式"],["上場","会社の株を証券取引所で一般の人が売買できるようにすること。","株式"],["現物取引","自分のお金の範囲で株を買う方法。","株式"],["信用取引","証券会社からお金や株を借りて取引する方法。","株式"],["債券","国や会社にお金を貸し、利息を受け取る仕組み。","金融"],["信用リスク","貸した相手が返せなくなるかもしれない危険。","金融"],["利回り","使ったお金に対して利益がどれくらい出るかの割合。","金融"],["終価係数","今あるお金が将来いくらになるかを見る係数。","係数"],["現価係数","将来ほしい金額のために今いくら必要かを見る係数。","係数"],["年金終価係数","毎年積み立てると将来いくらになるかを見る係数。","係数"],["減債基金係数","将来の目標額のため毎年いくら積み立てるかを見る係数。","係数"],["年金現価係数","将来毎年受け取るため今いくら必要かを見る係数。","係数"],["資本回収係数","今あるお金から毎年いくら受け取れるかを見る係数。","係数"],["定期保険","決めた期間だけ死亡保障を持つ生命保険。","保険"],["終身保険","死亡保障が一生続く生命保険。","保険"],["地震保険","地震・噴火・津波などによる損害に備える保険。","損害保険"],["自賠責保険","車やバイクに加入が義務づけられ、主に他人の人身損害を補償する保険。","損害保険"],["相続","亡くなった人の財産などを家族などが引き継ぐこと。","相続"],["基礎控除","税金の計算で一定額を差し引ける仕組み。","税金"]
];
const C=[
["6つの係数、どう覚える？","係数","名前を丸暗記するより『お金がどっち向きに動く？』で考えます。今→将来なら将来いくら？ 将来→今なら今いくら必要？ さらに1回のお金か、毎年のお金かを見ます。『10年後に100万円ほしい。毎年いくら積み立てる？』なら減債基金係数です。"],
["PERが高い会社はダメ？","株式","PERが高い＝ダメ、ではありません。成長を期待されて株を買いたい人が増えると株価が上がり、PERも高くなることがあります。PERだけで安い・高いを決めないのが大切です。"],
["含み益って、お金じゃないの？","株式","1,000円で買った株が1,500円になっても、500円はまだ財布の中のお金ではありません。『今売れば500円の利益』という状態が含み益です。売って初めて利益が確定します。"],
["金利が上がると、なぜ債券価格は下がる？","金融","昔の債券が年1万円、新しい債券が年3万円の利息なら、新しい方が人気です。古い債券はそのままの値段では売れにくくなるので、価格が下がりやすくなります。"],
["定期保険と終身保険の違い","保険","定期保険は『この期間だけ守って』、終身保険は『一生ずっと守って』というイメージです。一般に定期は少ない保険料で大きな保障を持ちやすく、終身は一生保障される分、保険料が高くなりやすいです。"],
["相続税の3000＋600って何？","相続","相続税の基礎控除は『3,000万円＋600万円×法定相続人の人数』です。相続人が3人なら4,800万円。まずは『相続税は3000＋600』と覚えると便利です。"]
];
let S=JSON.parse(localStorage.getItem('edaFP')||'null')||{a:0,c:0,w:[]},session=[],idx=0,score=0,locked=false;
const $=s=>document.querySelector(s),all=s=>[...document.querySelectorAll(s)];
function save(){localStorage.setItem('edaFP',JSON.stringify(S))}function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function stats(){let r=S.a?Math.round(S.c/S.a*100):0;$('#rate').textContent=r+'%';$('#answered').textContent=S.a+'問';$('#wrongCount').textContent=S.w.length+'問'}
function page(id){all('main section').forEach(x=>x.classList.add('hidden'));$('#'+id).classList.remove('hidden');all('.nav button[data-page]').forEach(x=>x.classList.toggle('active',x.dataset.page===id));if(id==='words')renderWords();if(id==='columns')renderCols();stats();scrollTo(0,0)}
function start(review=false){let pool=review?Q.map((q,i)=>[q,i]).filter(x=>S.w.includes(x[1])):shuffle(Q.map((q,i)=>[q,i])).slice(0,10);if(!pool.length){alert('まだ復習する問題はありません。');return}session=pool;idx=0;score=0;page('quiz');renderQ()}
function renderQ(){locked=false;let[q]=session[idx];$('#count').textContent=`${idx+1} / ${session.length}`;$('#question').textContent=q[0];$('#options').innerHTML='';q[1].forEach((t,i)=>{let b=document.createElement('button');b.className='opt';b.textContent=t;b.onclick=()=>answer(i,b);$('#options').appendChild(b)});$('#feedback').classList.add('hidden');$('#next').classList.add('hidden')}
function answer(choice,btn){if(locked)return;locked=true;let[q,orig]=session[idx],bs=all('.opt');bs.forEach(b=>b.disabled=true);bs[q[2]].classList.add('ok');S.a++;if(choice===q[2]){S.c++;score++;S.w=S.w.filter(x=>x!==orig)}else{btn.classList.add('ng');if(!S.w.includes(orig))S.w.push(orig)}save();$('#feedback').innerHTML='<b>'+(choice===q[2]?'正解！':'ここを復習しよう')+'</b><br><br>'+q[3];$('#feedback').classList.remove('hidden');$('#next').classList.remove('hidden')}
function next(){idx++;if(idx<session.length)return renderQ();$('#score').textContent=`${score} / ${session.length}`;let r=Math.round(score/session.length*100);$('#resultText').textContent=r>=90?'かなり定着しています。今日はここまででも十分！':r>=70?'いいペース。間違えた問題だけ復習すると効率的です。':'分からないところが見つかったのが収穫。ことば帳やコラムも使ってみてね。';page('result')}
function renderWords(){let q=$('#search').value.toLowerCase();$('#wordList').innerHTML='';W.filter(w=>w.join(' ').toLowerCase().includes(q)).forEach(w=>{let d=document.createElement('div');d.className='item';d.innerHTML=`<span class="tag">${w[2]}</span><h3>${w[0]}</h3><div class="muted">${w[1]}</div>`;$('#wordList').appendChild(d)})}
function renderCols(){$('#columnList').innerHTML='';C.forEach((c,i)=>{let d=document.createElement('div');d.className='item';d.innerHTML=`<span class="tag">${c[1]}</span><h3>${c[0]}</h3><small>タップして読む ▼</small><div id="cb${i}" class="colbody hidden">${c[2]}</div>`;d.onclick=()=>$('#cb'+i).classList.toggle('hidden');$('#columnList').appendChild(d)})}
$('#daily').onclick=()=>start(false);$('#review').onclick=()=>start(true);$('#navQuiz').onclick=()=>start(false);$('#next').onclick=next;$('#backHome').onclick=()=>page('home');$('#search').oninput=renderWords;all('.nav button[data-page]').forEach(b=>b.onclick=()=>page(b.dataset.page));stats();renderWords();renderCols();
</script></body></html>
