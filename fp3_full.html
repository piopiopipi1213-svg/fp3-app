${idx+1} / ${session.length}`;$('#question').textContent=q.q;$('#options').innerHTML='';q.opts.forEach((t,i)=>{let b=document.createElement('button');b.className='opt';b.textContent=t;b.onclick=()=>answer(i,b);$('#options').appendChild(b)});$('#feedback').classList.add('hidden');$('#next').classList.add('hidden')}function answer(choice,btn){if(locked)return;locked=true;let[q,orig]=session[idx],bs=all('.opt');bs.forEach(b=>b.disabled=true);bs[q.ans].classList.add('ok');S.a++;if(choice===q.ans){S.c++;score++;S.w=S.w.filter(x=>x!==orig)}else{btn.classList.add('ng');if(!S.w.includes(orig))S.w.push(orig)}save();$('#feedback').innerHTML='<b>'+(choice===q.ans?'正解！':'ここを復習しよう')+'</b><br><br>'+q.exp;$('#feedback').classList.remove('hidden');$('#next').classList.remove('hidden')}function next(){idx++;if(idx<session.length)return renderQ();$('#score').textContent=`${score} / ${session.length}`;let r=Math.round(score/session.length*100);$('#resultText').textContent=r>=90?'かなり定着しています。今日はここまででも十分！':r>=70?'いいペース。間違えた問題だけ復習すると効率的です。':'分からないところが見つかったのが収穫。ことば帳やコラムも使ってみてね。';page('result')}function renderWords(){let q=$('#search').value.toLowerCase();$('#wordList').innerHTML='';W.filter(w=>w.join(' ').toLowerCase().includes(q)).forEach(w=>{let d=document.createElement('div');d.className='item';d.innerHTML=`<span class="tag">${w[2]}</span><h3>${w[0]}</h3><div class="muted">${w[1]}</div>`;$('#wordList').appendChild(d)})}function renderCols(){$('#columnList').innerHTML='';C.forEach((c,i)=>{let d=document.createElement('div');d.className='item';d.innerHTML=`<span class="tag">${c[1]}</span><h3>${c[0]}</h3><small>タップして読む ▼</small><div id="cb${i}" class="colbody hidden">${c[2]}</div>`;d.onclick=()=>$('#cb'+i).classList.toggle('hidden');$('#columnList').appendChild(d)})}function setup(){let cats=[...new Set(Q.filter(q=>!q.cat.startsWith('⑦')).map(q=>q.cat))];$('#cats').innerHTML='';cats.forEach(c=>{let n=Q.filter(q=>q.cat===c).length,b=document.createElement('button');b.className='cat';b.innerHTML=`${c}<small>${n}問</small>`;b.onclick=()=>start('cat',c);$('#cats').appendChild(b)});$('#coverage').innerHTML='';cats.forEach(c=>{let subs=new Set(Q.filter(q=>q.cat===c).map(q=>q.sub));let d=document.createElement('div');d.className='cover';d.innerHTML=`<b>${c}</b><span>${subs.size}テーマ</span>`;$('#coverage').appendChild(d)})}$('#daily').onclick=()=>start('daily');$('#mock').onclick=()=>start('mock');$('#review').onclick=()=>start('review');$('#navQuiz').onclick=()=>start('daily');$('#next').onclick=next;$('#backHome').onclick=()=>page('home');$('#search').oninput=renderWords;all('.nav button[data-page]').forEach(b=>b.onclick=()=>page(b.dataset.page));setup();stats();renderWords();renderCols();
